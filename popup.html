<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
<main>
  <header>
    <img src="icons/icon48.png" alt="" width="32" height="32">
    <div><h1>Jobbot</h1><p id="sub">Amazon hiring assistant</p></div>
    <span class="chip" id="chip"><i></i><span id="chipText">Off</span></span>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab on" data-tab="home" role="tab">Home</button>
    <button class="tab" data-tab="settings" role="tab">Settings</button>
  </nav>

  <section data-pane="home">
    <label class="row">
      <span><b>Show panel</b><small>Control panel on Amazon hiring pages</small></span>
      <input type="checkbox" id="enabled" class="switch">
    </label>
    <p class="label">Start</p>
    <button class="primary" data-site="ca">Open job search · amazon.ca</button>
    <button class="ghost" data-site="com">Open job search · amazon.com</button>

    <div class="kyc" id="kycBox" hidden>
      <div class="kychead"><p class="label">Saved KYC links</p><button id="kycClear" class="link">Clear</button></div>
      <ul id="kycList"></ul>
    </div>
  </section>

  <section data-pane="settings" hidden>
    <p class="label">Automation</p>
    <label class="row">
      <span><b>Auto-continue</b><small>Search → job → application</small></span>
      <input type="checkbox" id="autoOpen" class="switch">
    </label>
    <label class="row">
      <span><b>Auto-login</b><small>Fill phone, PIN and SMS code</small></span>
      <input type="checkbox" id="autoLogin" class="switch">
    </label>
    <p class="label">Account</p>
    <div class="fields">
      <label>Phone or email <input id="loginPhone" type="text" autocomplete="off" placeholder="+1…"></label>
      <label>PIN <input id="loginPin" type="password" autocomplete="off"></label>
      <label>SMS inbox URL <input id="smsUrl" type="text" autocomplete="off" placeholder="https://temp-number.com/…"></label>
    </div>
    <p class="hint">Saved only in this browser's extension storage, never in the code. A public temp-number inbox can be read by anyone.</p>
  </section>
</main>
<script src="popup.js"></script>
